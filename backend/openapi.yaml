openapi: 3.1.0
info:
  title: STATION LIVE IPTV 4K API
  version: 0.1.0
  description: Initial contract only; endpoints are not implemented yet.
servers:
  - url: https://api.example.invalid/v1
paths:
  /sessions/xtream:
    post:
      summary: Create a session using Xtream account credentials
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 1, maxLength: 256 }
                password: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_in]
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer, minimum: 1 }
        '401': { description: Invalid account credentials }
        '429': { description: Rate limited }
  /sessions/m3u:
    post:
      summary: Create a session for an authorized M3U/M3U8 URL
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playlist_url]
              properties:
                playlist_url: { type: string, format: uri }
      responses:
        '200': { description: Session created }
        '400': { description: Invalid playlist URL }
        '429': { description: Rate limited }
  /catalogue/live:
    get:
      summary: Get live TV groups and channels
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Live catalogue }
  /catalogue/vod:
    get:
      summary: Get movies and series catalogue
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: VOD catalogue }
  /epg:
    get:
      summary: Get available EPG data
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: EPG data }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
